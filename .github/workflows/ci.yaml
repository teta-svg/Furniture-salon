name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '43 9 * * 5'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build -c ${{ matrix.configuration }} --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: salon-${{ matrix.configuration }}
          path: |
            **/bin/
            **/obj/
          retention-days: 14

  test:
    runs-on: windows-latest
    needs: build
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: salon-${{ matrix.configuration }}
          path: .
      - run: dotnet test -c ${{ matrix.configuration }} --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      - uses: actions/upload-artifact@v4
        with:
          name: code-coverage-${{ matrix.configuration }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          retention-days: 14
  
  analyze:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install -g dotnet-format
      - run: dotnet format
